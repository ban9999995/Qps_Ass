[project]
name = "qps-assistant"
version = "0.1.0"
description = "E-commerce operations assistant backend service"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncmy>=0.2.10,<1.0",
    "celery[redis]>=5.4,<6.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "minio>=7.2,<8.0",
    "openpyxl>=3.1,<4.0",
    "orjson>=3.10,<4.0",
    "pandas>=2.2,<3.0",
    "prometheus-client>=0.21,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "redis>=5.2,<6.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "structlog>=24.4,<26.0",
    "tenacity>=9.0,<10.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.scripts]
qps-assistant = "app.main:run"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",

    
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["^alembic/versions/"]
